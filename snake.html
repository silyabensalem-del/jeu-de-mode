<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Snake</title>
  <style>
    :root { --bg: #0f172a; --panel: #1e293b; --snake: #22c55e; --food: #f43f5e; --text: #e2e8f0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif; touch-action: none;
    }
    h1 { margin: 0; font-size: 28px; }
    #score { font-size: 18px; }
    canvas { background: var(--panel); border-radius: 12px; width: min(90vw, 400px); height: auto; }
    button {
      padding: 12px 28px; font-size: 16px; border: 0; border-radius: 10px;
      background: var(--snake); color: #052e16; font-weight: 700; cursor: pointer;
    }
    p { margin: 0; opacity: .6; font-size: 14px; text-align: center; padding: 0 16px; }
  </style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div id="score">Score : 0 · Record : 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="start">Jouer</button>
  <p>Flèches du clavier ou swipe sur mobile</p>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const startBtn = document.getElementById('start');
    const SIZE = 20, CELLS = canvas.width / SIZE;

    let snake, dir, nextDir, food, score, loop;
    let best = 0;
    try { best = Number(localStorage.getItem('snake-best')) || 0; } catch {}

    function updateScore() { scoreEl.textContent = `Score : ${score} · Record : ${best}`; }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function start() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = nextDir = { x: 1, y: 0 };
      score = 0;
      placeFood();
      updateScore();
      startBtn.style.visibility = 'hidden';
      clearInterval(loop);
      loop = setInterval(tick, 110);
    }

    function gameOver() {
      clearInterval(loop);
      if (score > best) {
        best = score;
        try { localStorage.setItem('snake-best', best); } catch {}
      }
      updateScore();
      startBtn.textContent = 'Rejouer';
      startBtn.style.visibility = 'visible';
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Perdu !', canvas.width / 2, canvas.height / 2);
    }

    function tick() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
      const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
      if (hitWall || hitSelf) return gameOver();

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--food');
      ctx.beginPath();
      ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--snake');
      snake.forEach(s => ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2));
    }

    function turn(x, y) {
      if (dir.x === -x && dir.y === -y) return; // pas de demi-tour
      nextDir = { x, y };
    }

    document.addEventListener('keydown', e => {
      const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
      if (map[e.key]) { e.preventDefault(); turn(...map[e.key]); }
    });

    let touchStart = null;
    document.addEventListener('touchstart', e => { touchStart = e.touches[0]; });
    document.addEventListener('touchend', e => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.clientX;
      const dy = e.changedTouches[0].clientY - touchStart.clientY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
      Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
      touchStart = null;
    });

    startBtn.addEventListener('click', start);
  </script>
</body>
</html>
