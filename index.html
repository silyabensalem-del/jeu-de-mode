<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Défi Mode</title>
  <style>
    :root { --bg: #fdf2f8; --card: #fff; --accent: #db2777; --text: #3b0a24; --muted: #9d5c7d; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; padding: 20px 16px;
    }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { color: var(--muted); margin-bottom: 16px; }
    .theme {
      background: var(--accent); color: #fff; border-radius: 14px; padding: 12px 20px;
      text-align: center; margin-bottom: 16px; width: 100%; max-width: 480px;
    }
    .theme b { font-size: 22px; display: block; }
    .model {
      background: var(--card); border-radius: 20px; width: 100%; max-width: 480px;
      padding: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      text-align: center; box-shadow: 0 4px 20px rgba(219,39,119,.12); margin-bottom: 16px;
    }
    .slot { font-size: 44px; min-height: 64px; display: flex; align-items: center; justify-content: center;
      border: 2px dashed #f9a8d4; border-radius: 12px; }
    .slot.filled { border-style: solid; border-color: var(--accent); }
    .label { font-size: 12px; color: var(--muted); }
    .cat { width: 100%; max-width: 480px; margin-bottom: 10px; }
    .cat h3 { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
    .items { display: flex; gap: 8px; flex-wrap: wrap; }
    .item {
      font-size: 30px; background: var(--card); border: 2px solid transparent; border-radius: 12px;
      width: 56px; height: 56px; cursor: pointer;
    }
    .item.selected { border-color: var(--accent); background: #fce7f3; }
    button.main {
      margin-top: 10px; padding: 14px 32px; font-size: 17px; font-weight: 700; border: 0;
      border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer;
    }
    button.main:disabled { opacity: .4; cursor: default; }
    #result { font-size: 18px; margin-top: 12px; min-height: 26px; text-align: center; }
    .footer { margin-top: 24px; font-size: 14px; }
    .footer a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>👗 Défi Mode</h1>
  <div class="sub" id="progress"></div>

  <div class="theme">Thème du défi<b id="theme"></b></div>

  <div class="model" id="model"></div>
  <div id="cats"></div>

  <button class="main" id="validate" disabled>Valider ma tenue</button>
  <div id="result"></div>

  <div class="footer"><a href="snake.html">🐍 Jouer aussi au Snake</a></div>

  <script>
    // Chaque vêtement porte des étiquettes de style ; le thème donne des points aux bonnes étiquettes.
    const CATS = {
      haut:        { label: 'Haut',        items: { '👕': ['casual', 'sport'], '👚': ['casual', 'plage'], '👔': ['chic', 'bureau'], '🧥': ['hiver', 'bureau'], '🥻': ['soiree', 'chic'] } },
      bas:         { label: 'Bas',         items: { '👖': ['casual', 'hiver'], '🩳': ['sport', 'plage'], '👗': ['soiree', 'chic', 'bureau'], '🩱': ['plage'] } },
      chaussures:  { label: 'Chaussures',  items: { '👟': ['sport', 'casual'], '👠': ['soiree', 'chic'], '👢': ['hiver'], '🩴': ['plage'], '👞': ['bureau', 'chic'] } },
      accessoire:  { label: 'Accessoire',  items: { '🕶️': ['plage', 'casual'], '👜': ['chic', 'bureau'], '🧣': ['hiver'], '👒': ['plage'], '💍': ['soiree', 'chic'], '🧢': ['sport', 'casual'] } },
    };
    const THEMES = [
      { name: '🏖️ Journée à la plage', tag: 'plage' },
      { name: '✨ Soirée de gala',      tag: 'soiree' },
      { name: '❄️ Balade en hiver',     tag: 'hiver' },
      { name: '💼 Entretien d\'embauche', tag: 'bureau' },
      { name: '🏃 Séance de sport',     tag: 'sport' },
      { name: '☕ Brunch entre amis',   tag: 'casual' },
      { name: '🥂 Dîner chic',          tag: 'chic' },
    ];
    const ROUNDS = 5;

    let round, total, theme, outfit;
    const $ = id => document.getElementById(id);

    function newGame() {
      round = 0; total = 0;
      $('validate').onclick = validate;
      nextRound();
    }

    function nextRound() {
      round++;
      outfit = {};
      theme = THEMES[Math.floor(Math.random() * THEMES.length)];
      $('theme').textContent = theme.name;
      $('progress').textContent = `Manche ${round} / ${ROUNDS} · Score total : ${total}`;
      $('result').textContent = '';
      $('validate').textContent = 'Valider ma tenue';
      $('validate').onclick = validate;
      render();
    }

    function render() {
      $('model').innerHTML = Object.entries(CATS).map(([key, c]) =>
        `<div><div class="slot ${outfit[key] ? 'filled' : ''}">${outfit[key] || ''}</div><div class="label">${c.label}</div></div>`
      ).join('');
      $('cats').innerHTML = Object.entries(CATS).map(([key, c]) =>
        `<div class="cat"><h3>${c.label}</h3><div class="items">` +
        Object.keys(c.items).map(e =>
          `<button class="item ${outfit[key] === e ? 'selected' : ''}" data-cat="${key}" data-item="${e}">${e}</button>`
        ).join('') + `</div></div>`
      ).join('');
      document.querySelectorAll('.item').forEach(b => b.onclick = () => {
        outfit[b.dataset.cat] = b.dataset.item;
        render();
      });
      $('validate').disabled = Object.keys(outfit).length < Object.keys(CATS).length;
    }

    function validate() {
      const hits = Object.entries(outfit).filter(([key, e]) => CATS[key].items[e].includes(theme.tag)).length;
      const points = hits * 25;
      total += points;
      const verdict = points === 100 ? '🌟 Parfait, icône de mode !' : points >= 75 ? '😍 Très stylé !' : points >= 50 ? '🙂 Pas mal !' : '😬 Hmm… osé !';
      $('result').textContent = `${verdict} +${points} points`;
      $('progress').textContent = `Manche ${round} / ${ROUNDS} · Score total : ${total}`;
      document.querySelectorAll('.item').forEach(b => b.disabled = true);
      if (round < ROUNDS) {
        $('validate').textContent = 'Manche suivante →';
        $('validate').onclick = nextRound;
      } else {
        $('result').textContent += ` — Partie terminée : ${total} / ${ROUNDS * 100}`;
        $('validate').textContent = 'Rejouer';
        $('validate').onclick = newGame;
      }
    }

    newGame();
  </script>
</body>
</html>
